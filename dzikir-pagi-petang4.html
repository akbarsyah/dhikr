<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f5ef">
<title>Dzikir Pagi &amp; Petang</title>
<style>
:root{
  color-scheme:light;
  --bg:#f7f5ef;--text:#20221f;--muted:#5f625b;--line:#e2dfd5;
  --accent:#3f6b59;--on-accent:#fff;--arabic:#1b2520;
  --serif:Georgia,"Times New Roman",serif;
  --sans:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --pad:20px;
}
[data-theme="dark"]{
  color-scheme:dark;
  --bg:#151816;--text:#eef1ed;--muted:#a6ada7;--line:#2e342f;
  --accent:#9fc5af;--on-accent:#10160f;--arabic:#f5f7f4;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(64px + env(safe-area-inset-top))}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.6;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.app{max-width:720px;margin:auto;padding:24px max(var(--pad),env(safe-area-inset-right)) calc(64px + env(safe-area-inset-bottom)) max(var(--pad),env(safe-area-inset-left))}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.eyebrow{margin:0;text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:var(--muted);font-weight:600}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(32px,8vw,48px);line-height:1.08;margin:0 0 8px;letter-spacing:-.01em}
.subtitle{color:var(--muted);margin:0 0 26px;font-size:15px}
.tools{display:flex;gap:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px}
.seg button:first-child{border-radius:5px 0 0 5px}.seg button:last-child{border-radius:0 5px 5px 0}
.seg button,.tool{min-height:44px;min-width:44px;padding:0 12px;background:none;border:0;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.tool{border:1px solid var(--line);border-radius:6px}
.seg button[aria-pressed="true"],.tool[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}

/* sticky session bar */
.sticky{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.bar{height:2px;background:var(--line)}
.bar>span{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.tabs{display:flex;gap:22px}
.tab{min-height:48px;padding:0 2px;margin-bottom:-1px;background:none;border:0;border-bottom:2px solid transparent;font-size:16px;font-weight:600;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.meter{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

/* list */
.item{border-bottom:1px solid var(--line)}
.h{margin:0;font-size:inherit;font-weight:inherit}
.head{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:baseline;width:100%;min-height:60px;padding:18px 0;background:none;border:0;text-align:left;cursor:pointer}
.num{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.title{min-width:0;overflow-wrap:break-word;font-family:var(--serif);font-size:19px;line-height:1.3}
.count{font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.item.done .title,.item.done .num{color:var(--muted)}
.item.done .count{color:var(--accent);font-weight:600}
.body{padding:2px 0 28px}
.arabic{font-family:"Noto Naskh Arabic","Amiri","Scheherazade New","Geeza Pro","Traditional Arabic",serif;font-size:clamp(27px,7vw,36px);line-height:2.15;text-align:right;direction:rtl;color:var(--arabic);margin:4px 0 24px;text-rendering:optimizeLegibility}
.latin{margin:-8px 0 24px;font-size:15px;line-height:1.75;color:var(--muted);overflow-wrap:break-word}
.label{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.meaning{overflow-wrap:break-word;margin:0 0 22px;font-size:16px;line-height:1.7;max-width:62ch}
.evidence{margin:0;font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.grade{margin:8px 0 0;font-size:14px;font-weight:600;color:var(--accent)}
.note{overflow-wrap:break-word;margin:14px 0 0;font-size:13px;color:var(--muted)}
.counter{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:24px}
.readout{white-space:nowrap;font-family:var(--serif);font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.readout small{font-size:16px;color:var(--muted)}
.tap{flex:1;min-width:112px;max-width:230px;min-height:58px;border:0;border-radius:6px;background:var(--accent);color:var(--on-accent);font-size:15px;font-weight:700;letter-spacing:.08em;cursor:pointer;user-select:none;-webkit-user-select:none}
.tap:active:not(:disabled){opacity:.85}
.tap:disabled{background:none;color:var(--accent);border:1px solid var(--line);cursor:default}
.reset{min-height:44px;margin-top:6px;padding:0;background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.reset[hidden]{display:none}
.complete{margin:28px 0 0;text-align:center;font-family:var(--serif);font-size:18px;color:var(--accent)}
footer{margin-top:36px;text-align:center;color:var(--muted);font-size:12px}
@media (max-width:420px){.app{--pad:16px}.tabs{gap:16px}.top{flex-wrap:wrap}.eyebrow{flex:1 0 100%}}
@media (prefers-reduced-motion:reduce){.bar>span{transition:none}}
</style>
</head>

<div class="app">
<header>
  <div class="top">

</div>

<footer data-i18n="footer">Sumber utama: Dzikir Pagi &amp; Petang Sesuai Sunnah Nabi ﷺ — Yayasan Cinta Sedekah.</footer>
</div>

<script>
const DATA = {"morning": [{"id": "ayat-kursi", "title": {"id": "Ayat Kursi", "en": "Ayat al-Kursi"}, "count": 1, "arabic": "اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ", "latin": "Allāhu lā ilāha illā huwa al-ḥayyu al-qayyūm. Lā taʾkhudhuhū sinatun wa-lā nawm. Lahū mā fī as-samāwāti wa-mā fī al-arḍ. Man dhā alladhī yashfaʿu ʿindahū illā bi-idhnih. Yaʿlamu mā bayna aydīhim wa-mā khalfahum. Wa-lā yuḥīṭūna bi-shayʾin min ʿilmihī illā bi-mā shāʾ. Wasiʿa kursiyyuhu as-samāwāti wa-l-arḍ. Wa-lā yaʾūduhū ḥifẓuhumā. Wa-huwa al-ʿaliyyu al-ʿaẓīm.", "meaning": {"id": "Allah tidak ada Ilah (yang berhak diibadahi dengan benar) melainkan Dia Yang Hidup Kekal lagi terus menerus mengurus (makhluk-Nya); tidak mengantuk dan tidak tidur. Kepunyaan-Nya apa yang ada di langit dan di bumi. Tidak ada yang dapat memberi syafa’at di sisi Allah tanpa izin-Nya. Allah mengetahui apa-apa yang (berada) dihadapan mereka, dan dibelakang mereka dan mereka tidak mengetahui apa-apa dari Ilmu Allah melainkan apa yang dikehendaki-Nya. Kursi Allah meliputi langit dan bumi. Dan Allah tidak merasa berat memelihara keduanya, Allah Mahatinggi lagi Mahabesar.", "en": "Allah — there is no Ilah (none worthy of being worshipped in truth) except Him, the Ever-Living, the One who continuously sustains and manages (His creation). Neither drowsiness nor sleep overtakes Him. To Him belongs whatever is in the heavens and on the earth. Who can intercede with Allah except by His permission? Allah knows what is before them and what is behind them, and they encompass nothing of Allah’s knowledge except what He wills. The Kursi of Allah extends over the heavens and the earth, and Allah is not burdened by preserving them both. Allah is the Most High, the Most Great."}, "evidence": "QS. Al-Baqarah/2: 255. Barangsiapa yang membaca ayat ini ketika pagi hari, maka ia dilindungi dari (gangguan) jin hingga sore hari. Dan barangsiapa mengucapkannya ketika sore hari, maka ia dilindungi dari (gangguan) jin hingga pagi hari. (Lihat Mustadrak Al-Hakim 1/562, Shahiih at-Targhiib wat Tarhiib 1/418 no. 662, shahih).", "grade": "Shahih"}, {"id": "al-ikhlas", "title": {"id": "Al-Ikhlas", "en": "Al-Ikhlas"}, "count": 3, "arabic": "قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ", "latin": "Qul huwa Allāhu aḥad. Allāhu aṣ-ṣamad. Lam yalid wa-lam yūlad. Wa-lam yakun lahū kufuwan aḥad.", "meaning": {"id": "Katakanlah, Dia-lah Allah Yang Maha Esa. Allah adalah (Rabb) yang segala sesuatu bergantung kepada-Nya. Dia tidak beranak dan tidak pula diperanakkan. Dan tidak ada seorang pun yang setara dengan-Nya.", "en": "Say: He is Allah, the One. Allah is the (Lord) upon Whom everything depends. He neither begets nor is begotten. And there is none at all comparable to Him."}, "evidence": "QS. Al-Ikhlash/112: 1-4. HR. Abu Dawud no. 5082, an-Nasa-i VIII/250 dan at-Tirmidzi no. 3575, Ahmad V/312, Shahiih at-Tirmidzi no. 2829, Tuhfatul Ahwadzi no. 3646, Shahiih at-Targhiib wat Tarhiib 1/411 no. 649, hasan shahih.", "grade": "Hasan shahih"}, {"id": "al-falaq", "title": {"id": "Al-Falaq", "en": "Al-Falaq"}, "count": 3, "arabic": "قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِنْ شَرِّ مَا خَلَقَ ۝ وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ", "latin": "Qul aʿūdhu bi-Rabbi al-falaq. Min sharri mā khalaq. Wa-min sharri ghāsiqin idhā waqab. Wa-min sharri an-naffāthāti fī al-ʿuqad. Wa-min sharri ḥāsidin idhā ḥasad.", "meaning": {"id": "Katakanlah: ‘Aku berlindung kepada Rabb Yang menguasai (waktu) Shubuh dari kejahatan makhluk-Nya. Dan dari kejahatan malam apabila telah gelap gulita. Dan dari kejahatan wanita-wanita tukang sihir yang menghembus pada buhul-buhul. Serta dari kejahatan orang yang dengki apabila dia dengki.’", "en": "Say: ‘I seek refuge with the Lord who has dominion over (the time of) daybreak, from the evil of His creation. And from the evil of the night when it has grown pitch dark. And from the evil of the women who practise sorcery, blowing on knots. And from the evil of the envier when he envies.’"}, "evidence": "QS. Al-Falaq/113: 1-5. HR. Abu Dawud no. 5082, an-Nasa-i VIII/250 dan at-Tirmidzi no. 3575, Ahmad V/312, Shahiih at-Tirmidzi no. 2829, Tuhfatul Ahwadzi no. 3646, Shahiih at-Targhiib wat Tarhiib 1/411 no. 649, hasan shahih.", "grade": "Hasan shahih"}, {"id": "an-naas", "title": {"id": "An-Naas", "en": "An-Naas"}, "count": 3, "arabic": "قُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝ مَلِكِ النَّاسِ ۝ إِلَٰهِ النَّاسِ ۝ مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝ مِنَ الْجِنَّةِ وَالنَّاسِ", "latin": "Qul aʿūdhu bi-Rabbi an-nās. Maliki an-nās. Ilāhi an-nās. Min sharri al-waswāsi al-khannās. Alladhī yuwaswisu fī ṣudūri an-nās. Mina al-jinnati wa-n-nās.", "meaning": {"id": "Katakanlah, ‘Aku berlindung kepada Rabb (yang memelihara dan menguasai) manusia. Raja manusia. Sembahan (Ilah) manusia. Dari kejahatan (bisikan) syaitan yang biasa bersembunyi. Yang membisikkan (kejahatan) ke dalam dada-dada manusia. Dari golongan jin dan manusia.’", "en": "Say, ‘I seek refuge with the Lord (who nurtures and has dominion over) mankind. The King of mankind. The Ilah (God) of mankind. From the evil of the (whispering of the) devil who habitually hides away. Who whispers (evil) into the hearts of mankind. From among the jinn and mankind.’"}, "evidence": "QS. An-Naas/114: 1-6. HR. Abu Dawud no. 5082, an-Nasa-i VIII/250 dan at-Tirmidzi no. 3575, Ahmad V/312, Shahiih at-Tirmidzi no. 2829, Tuhfatul Ahwadzi no. 3646, Shahiih at-Targhiib wat Tarhiib 1/411 no. 649, hasan shahih.", "grade": "Hasan shahih"}, {"id": "fitrah", "title": {"id": "Dzikir Fitrah Islam", "en": "Dhikr of the Islamic Fitrah"}, "count": 1, "arabic": "أَصْبَحْنَا عَلَى فِطْرَةِ الْإِسْلَامِ، وَعَلَى كَلِمَةِ الْإِخْلَاصِ، وَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ ﷺ، وَعَلَى مِلَّةِ أَبِينَا إِبْرَاهِيمَ حَنِيفًا مُسْلِمًا وَمَا كَانَ مِنَ الْمُشْرِكِينَ", "latin": "Aṣbaḥnā ʿalā fiṭrati al-islām, wa-ʿalā kalimati al-ikhlāṣ, wa-ʿalā dīni nabiyyinā Muḥammad ṣallā Allāhu ʿalayhi wa-sallam, wa-ʿalā millati abīnā Ibrāhīma ḥanīfan musliman wa-mā kāna mina al-mushrikīn.", "meaning": {"id": "Di waktu pagi kami berada di atas fitrah agama Islam, kalimat ikhlas, agama Nabi kami Muhammad ﷺ dan agama ayah kami, Ibrahim, yang berdiri di atas jalan yang lurus, muslim dan tidak tergolong orang-orang musyrik.", "en": "In the morning we are upon the fitrah of the religion of Islam, the word of sincerity, the religion of our Prophet Muhammad ﷺ, and the religion of our father Ibrahim, who stood upon the straight path, a Muslim, and was not among the polytheists."}, "evidence": "HR. Ahmad III/406, 407, ad-Darimi II/292 dan Ibnus Sunni dalam Amalul Yaum wol Lailah no. 34, Misykaatul Mashaabiih no. 2415, Shahiihal-Jaami’ish Shaghiir no. 4674, shahih.", "grade": "Shahih"}, {"id": "raditu", "title": {"id": "Ridha kepada Allah", "en": "Contentment with Allah"}, "count": 3, "arabic": "رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ نَبِيًّا", "latin": "Raḍītu bi-llāhi Rabbā, wa-bi-l-islāmi dīnā, wa-bi-Muḥammadin nabiyyā.", "meaning": {"id": "Aku rela (ridha) Allah sebagai Rabb-ku (untukku dan orang lain), Islam sebagai agamaku dan Muhammad ﷺ sebagai Nabiku (yang diutus oleh Allah).", "en": "I am pleased (content) with Allah as my Lord (for myself and for others), with Islam as my religion, and with Muhammad ﷺ as my Prophet (the one sent by Allah)."}, "evidence": "“Barangsiapa membacanya sebanyak tiga kali ketika pagi dan sore, maka Allah memberikan keridhaan-Nya kepadanya pada hari Kiamat.” HR. Ahmad IV/337, Abu Dawud no. 5072, at-Tirmidzi no. 3389, Ibnu Majah no. 3870, an-Nasa-i dalam ‘Amalul Yaum wal Lailah no. 4 dan Ibnus Sunni no. 68, dishahihkan oleh Imam al-Hakim dalam al-Mustadrak 1/518 dan disetujui oleh Imam adz-Dzahabi, hasan. Lihat Shahiih At Targhiib wat Tarhiib I/415 no. 657, Shahiih At Targhiib wat Tarhiib al-Waabilish Shayyib hal. 170, Zaadul Ma’aad II/372, Silsilah al-Ahaadiits ash-Shahiihah no. 2686.", "grade": "Hasan"}, {"id": "bika-asbahna", "title": {"id": "Dengan-Mu Kami Memasuki Pagi", "en": "By You We Enter the Morning"}, "count": 1, "arabic": "اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ النُّشُورُ", "latin": "Allāhumma bika aṣbaḥnā, wa-bika amsaynā, wa-bika naḥyā, wa-bika namūt, wa-ilayka an-nushūr.", "meaning": {"id": "Ya Allah, dengan rahmat dan pertolongan-Mu kami memasuki waktu pagi, dan dengan rahmat dan pertolongan-Mu kami memasuki waktu sore. Dengan rahmat dan kehendak-Mu kami hidup dan dengan rahmat dan kehendak-Mu kami mati. Dan kepada-Mu kebangkitan (bagi semua makhluk).", "en": "O Allah, by Your mercy and help we enter the morning, and by Your mercy and help we enter the evening. By Your mercy and will we live, and by Your mercy and will we die. And to You is the resurrection (of all creatures)."}, "evidence": "HR. Al-Bukhari dalam al-Adabul Mufrad no. 1199, lafazh ini adalah lafazh al-Bukhari, at-Tirmidzi no. 3391, Abu Dawud no. 5068, Ahmad 11/354, Ibnu Majah no. 3868, Dari Abu Hurairah Radhiyallahu ‘anhu. Shahiih al-Adabil Mufrad no. 911, shahih. Lihat pula Silsilah al-Ahaadiits ash-Shahiihah no. 262.", "grade": "Shahih"}, {"id": "asbahna-mulk", "title": {"id": "Kami Memasuki Pagi dan Kerajaan Milik Allah", "en": "We Enter the Morning and Sovereignty Belongs to Allah"}, "count": 1, "arabic": "أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذَا الْيَوْمِ وَخَيْرَ مَا بَعْدَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذَا الْيَوْمِ وَشَرِّ مَا بَعْدَهُ، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابِ الْقَبْرِ", "latin": "Aṣbaḥnā wa-aṣbaḥa al-mulku li-llāh, wa-l-ḥamdu li-llāh, lā ilāha illā Allāhu waḥdahū lā sharīka lah, lahu al-mulku wa-lahu al-ḥamd, wa-huwa ʿalā kulli shayʾin qadīr, Rabbi asʾaluka khayra mā fī hādhā al-yawmi wa-khayra mā baʿdah, wa-aʿūdhu bika min sharri mā fī hādhā al-yawmi wa-sharri mā baʿdah, Rabbi aʿūdhu bika mina al-kasali wa-sūʾi al-kibar, Rabbi aʿūdhu bika min ʿadhābin fī an-nār wa-ʿadhābi al-qabr.", "meaning": {"id": "Kami telah memasuki waktu pagi dan kerajaan hanya milik Allah, segala puji bagi Allah. Tidak ada Tuhan (yang berhak disembah) kecuali Allah Yang Maha Esa, tiada sekutu bagi-Nya. Bagi-Nya kerajaan dan bagi-Nya pujian. Dia-lah Yang Mahakuasa atas segala sesuatu. Hai Tuhan, aku mohon kepada-Mu kebaikan di hari ini dan kebaikan sesudahnya. Aku berlindung kepada-Mu dari kejahatan hari ini dan kejahatan sesudahnya. Wahai Tuhan, aku berlindung kepada-Mu dari kemalasan dan kejelekan di hari tua. Wahai Tuhan! Aku berlindung kepada-Mu dari siksaan di Neraka dan kubur.", "en": "We have entered the morning and the dominion belongs to Allah alone; all praise is for Allah. There is no God (worthy of worship) except Allah, the One, with no partner. His is the dominion and His is the praise. He is the One who has power over all things. O Lord, I ask You for the good of this day and the good of what comes after it. I seek refuge with You from the evil of this day and the evil of what comes after it. O Lord, I seek refuge with You from laziness and the misery of old age. O Lord! I seek refuge with You from punishment in the Fire and in the grave."}, "evidence": "HR. Muslim no. 2723 (75), Abu Dawud no. 5071, dan at-Tirmidzi 3390, shahih dari Abdullah Ibnu Mas’ud.", "grade": "Shahih"}, {"id": "sayyidul-istighfar", "title": {"id": "Sayyidul Istighfar", "en": "Master Supplication for Forgiveness"}, "count": 1, "arabic": "اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي، فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ", "latin": "Allāhumma anta Rabbī lā ilāha illā anta, khalaqtanī wa-anā ʿabduka, wa-anā ʿalā ʿahdika wa-waʿdika mā istaṭaʿtu, aʿūdhu bika min sharri mā ṣanaʿtu, abūʾu laka bi-niʿmatika ʿalayya, wa-abūʾu bi-dhanbī, fa-ghfir lī, fa-innahū lā yaghfiru adh-dhunūba illā anta.", "meaning": {"id": "Ya Allah, Engkau lah Tuhanku. Tidak ada Tuhan selain Engkau. Engkau yang menciptakan aku dan aku adalah hamba-Mu. Aku berada di dalam hidayah-Mu, dan perjanjian dengan-Mu. Sebisa yang aku mampu. Aku berlindung kepada-Mu, dari segala kejelekan yang aku perbuat. Aku bersyukur atas nikmat yang Engkau limpahkan kepada kami, dan aku menyesal atas segala dosa yang aku perbuat. Maka ampunilah aku, sesungguhnya tidak ada yang dapat mengampuni dosa selain Engkau.", "en": "O Allah, You are my Lord. There is no God but You. You created me and I am Your servant. I am within Your guidance and the covenant with You, as far as I am able. I seek refuge with You from all the evil that I have done. I am grateful for the blessings You have bestowed upon us, and I regret all the sins I have committed. So forgive me, for truly none can forgive sins except You."}, "evidence": "“Barangsiapa membacanya dengan yakin di waktu pagi lalu ia meninggal sebelum masuk waktu sore, maka ia termasuk ahli Surga. Dan barangsiapa membacanya dengan yakin di waktu sore lalu ia meninggal sebelum masuk waktu pagi, maka ia termasuk ahli Surga.” (HR. Al-Bukhari no. 6306, 6323, Ahmad IV/122-125, an-Nasa-i VIII/279-280) dari Syaddad bin Aus Radhiyallahu ‘anhu", "grade": "Shahih"}, {"id": "afwu-afiyah", "title": {"id": "Memohon ‘Afw dan ‘Afiyah", "en": "Asking for Pardon and Well-being"}, "count": 1, "arabic": "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي، اللَّهُمَّ اسْتُرْ عَوْرَاتِي وَآمِنْ رَوْعَاتِي، اللَّهُمَّ احْفَظْنِي مِنْ بَيْنِ يَدَيَّ وَمِنْ خَلْفِي وَعَنْ يَمِينِي وَعَنْ شِمَالِي وَمِنْ فَوْقِي، وَأَعُوذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي", "latin": "Allāhumma innī asʾaluka al-ʿafwa wa-l-ʿāfiyata fī ad-dunyā wa-l-ākhirah, Allāhumma innī asʾaluka al-ʿafwa wa-l-ʿāfiyata fī dīnī wa-dunyāya wa-ahlī wa-mālī, Allāhumma ustur ʿawrātī wa-āmin rawʿātī, Allāhumma iḥfaẓnī min bayni yadayya wa-min khalfī wa-ʿan yamīnī wa-ʿan shimālī wa-min fawqī, wa-aʿūdhu bi-ʿaẓamatika an ughtāla min taḥtī.", "meaning": {"id": "Ya Allah, sesungguhnya aku memohon kebajikan dan keselamatan di dunia dan akhirat. Ya Allah, sesungguhnya aku memohon kebajikan dan keselamatan dalam agama, dunia, keluarga dan hartaku. Ya Allah, tutupilah auratku (aib dan sesuatu yang tidak layak dilihat orang) dan tentramkan-lah aku dari rasa takut. Ya Allah, peliharalah aku dari depan, belakang, kanan, kiri dan dari atasku. Aku berlindung dengan kebesaran-Mu, agar aku tidak disambar dari bawahku (aku berlindung dari dibenamkan ke dalam bumi).", "en": "O Allah, I truly ask You for goodness and well-being in this world and the Hereafter. O Allah, I truly ask You for goodness and well-being in my religion, my worldly life, my family and my wealth. O Allah, cover my ‘awrah (my faults and whatever is not fit to be seen by others) and calm me from fear. O Allah, protect me from in front of me, from behind, from my right, my left, and from above me. I seek refuge in Your greatness, that I not be seized from beneath me (I seek refuge from being swallowed into the earth)."}, "evidence": "HR. Al-Bukhari dalam al-Adabul Mufrad no. 1200, Abu Dawud no. 5074, An-Nasa-i VIII/282, Ibnu Majah no. 3871, al-Hakim 1/517-518, dan lainnya dari Ibnu Umar radhiyallahu ‘anhumaa. Lihat Shahiih al-Adabul Mufrad no. 912, shahih.", "grade": "Shahih"}, {"id": "afini-badani", "title": {"id": "Memohon Kesehatan Badan", "en": "Asking for Well-being"}, "count": 3, "arabic": "اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَهَ إِلَّا أَنْتَ، اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكُفْرِ وَالْفَقْرِ، اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ، لَا إِلَهَ إِلَّا أَنْتَ", "latin": "Allāhumma ʿāfinī fī badanī, Allāhumma ʿāfinī fī samʿī, Allāhumma ʿāfinī fī baṣarī, lā ilāha illā anta, Allāhumma innī aʿūdhu bika mina al-kufri wa-l-faqr, Allāhumma innī aʿūdhu bika min ʿadhābi al-qabr, lā ilāha illā anta.", "meaning": {"id": "Ya Allah, selamatkanlah tubuhku (dari penyakit dan dari apa yang tidak aku inginkan). Ya Allah, sehatkanlah pendengaranku. Ya Allah, sehatkanlah penglihatanku, tidak ada Ilah yang berhak diibadahi dengan benar kecuali Engkau. Ya Allah sesungguhnya aku berlindung kepada-Mu dari kekufuran dan kefakiran. Aku berlindung kepada-Mu dari siksa kubur, tidak ada Ilah yang berhak diibadahi dengan benar kecuali Engkau.", "en": "O Allah, keep my body safe (from illness and from what I do not want). O Allah, make healthy my hearing. O Allah, make healthy my sight; there is no Ilah worthy of worship in truth except You. O Allah, truly I seek refuge with You from disbelief and poverty. I seek refuge with You from the punishment of the grave; there is no Ilah worthy of worship in truth except You."}, "evidence": "HR. Al-Bukhari dalam Shahiih al-Adabil Mufrad no. 701, Abu Dawud no. 5090, Ahmad V/42, hasan. Lihat Shahiih Al-Adabil Mufrad no. 539.", "grade": "Hasan"}, {"id": "alim-ghaib", "title": {"id": "Allah Yang Mengetahui yang Ghaib", "en": "Allah, Knower of the Unseen"}, "count": 1, "arabic": "اللَّهُمَّ عَالِمَ الْغَيْبِ وَالشَّهَادَةِ، فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ، رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ، أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي، وَمِنْ شَرِّ الشَّيْطَانِ وَشِرْكِهِ، وَأَنْ أَقْتَرِفَ عَلَى نَفْسِي سُوءًا أَوْ أَجُرَّهُ إِلَى مُسْلِمٍ", "latin": "Allāhumma ʿālima al-ghaybi wa-sh-shahādah, fāṭira as-samāwāti wa-l-arḍ, Rabba kulli shayʾin wa-malīkah, ashhadu an lā ilāha illā anta, aʿūdhu bika min sharri nafsī, wa-min sharri ash-shayṭāni wa-shirkih, wa-an aqtarifa ʿalā nafsī sūʾan aw ajurrahū ilā muslim.", "meaning": {"id": "Ya Allah Yang Mahamengetahui yang ghaib dan yang nyata, wahai Rabb Pencipta langit dan bumi, Rabb atas segala sesuatu dan Yang Merajainya. Aku bersaksi bahwa tidak ada Ilah yang berhak diibadahi dengan benar kecuali Engkau. Aku berlindung kepada-Mu dari kejahatan diriku, syaitan dan ajakannya menyekutukan Allah (aku berlindung kepada-Mu) dari berbuat kejelekan atas diriku atau mendorong seorang muslim kepadanya.", "en": "O Allah, the All-Knowing of the unseen and the seen, O Lord, Creator of the heavens and the earth, Lord of all things and their Sovereign. I bear witness that there is no Ilah worthy of worship in truth except You. I seek refuge with You from the evil of myself, and from the devil and his call to associate partners with Allah (I seek refuge with You) from doing wrong against myself or drawing a Muslim into it."}, "evidence": "HR. Al-Bukhari dalam Al-Adabul Mufrad 1202, at-Tirmidzi no. 3392 dan Abu Daud no. 5067. Lihat Shahih At-Tirmidzi no. 2798.", "grade": "Shahih"}, {"id": "bismillah-la-yadurru", "title": {"id": "Bismillah yang Tidak Membahayakan", "en": "Bismillah for Protection"}, "count": 3, "arabic": "بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ", "latin": "Bi-smi llāhi alladhī lā yaḍurru maʿa ismihī shayʾun fī al-arḍi wa-lā fī as-samāʾ, wa-huwa as-samīʿu al-ʿalīm.", "meaning": {"id": "Dengan Menyebut Nama Allah, yang dengan Nama-Nya tidak ada satupun yang membahayakan, baik di bumi maupun di langit. Dia-lah Yang Mahamendengar dan Mahamengetahui.", "en": "In the name of Allah, with whose Name nothing at all can cause harm, whether on earth or in heaven. He is the All-Hearing and the All-Knowing."}, "evidence": "“Barangsiapa membacanya sebanyak tiga kali ketika pagi dan sore hari, maka tidak ada sesuatu pun yang membahayakan dirinya.” HR. At-Tirmidzi no. 3388, Abu Dawud no. 5088, Ibnu Majah no. 3869, al-Hakim 1/514, dan Ahmad no. 446 dan 474, Tahqiq Ahmad Syakir. Dari ‘Utsman bin ‘Affan radhiyallahu ‘anhu, lihat Shahiih Ibni Majah no. 3120, al-Hakim 1/513, Shahiih al-Adabil Mufrad no. 513, Shahiih at-Targhiib wat Tarhiib 1/413 no. 655, sanad-nya shahih.", "grade": "Shahih"}, {"id": "hayyu-qayyum", "title": {"id": "Ya Hayyu Ya Qayyum", "en": "O Ever-Living, O Sustainer"}, "count": 1, "arabic": "يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ، أَصْلِحْ لِي شَأْنِي كُلَّهُ، وَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ", "latin": "Yā Ḥayyu yā Qayyūm, bi-raḥmatika astaghīth, aṣliḥ lī shaʾnī kullah, wa-lā takilnī ilā nafsī ṭarfata ʿayn.", "meaning": {"id": "Wahai Rabb Yang Maha Hidup, wahai Rabb Yang Berdiri Sendiri (tidak butuh segala sesuatu), dengan rahmat-Mu aku minta pertolongan, perbaikilah segala urusanku dan jangan diserahkan kepadaku sekalipun sekejap mata (tanpa mendapat pertolongan dari-Mu).", "en": "O Lord, the Ever-Living, O Lord, the Self-Subsisting (in need of nothing), by Your mercy I ask for help. Set right all my affairs, and do not leave me to myself even for the blink of an eye (without receiving help from You)."}, "evidence": "HR. An-Nasa-i dalam ‘Amalul Yaum wal Lailah no. 575, dan al-Hakim 1/545, lihat Shahiih at-Targhiib wat Tarhiib 1/417 no. 661, Ash-shahiihah no. 227, hasan, dari Anas radhiyallahu ‘anhu.", "grade": "Hasan"}, {"id": "subhanallah-adada", "title": {"id": "Tasbih Sejumlah Makhluk-Nya", "en": "Tasbih Equal to the Number of His Creation"}, "count": 3, "arabic": "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، عَدَدَ خَلْقِهِ، وَرِضَا نَفْسِهِ، وَزِنَةَ عَرْشِهِ، وَمِدَادَ كَلِمَاتِهِ", "latin": "Subḥāna Allāhi wa-bi-ḥamdih, ʿadada khalqih, wa-riḍā nafsih, wa-zinata ʿarshih, wa-midāda kalimātih.", "meaning": {"id": "Mahasuci Allah, aku memuji-Nya sebanyak bilangan makhluk-Nya, Mahasuci Allah sesuai keridhaan-Nya, Mahasuci seberat timbangan ‘Arsy-Nya, dan Mahasuci sebanyak tinta (yang menulis) kalimat-Nya.", "en": "Glory be to Allah; I praise Him as many times as the number of His creation. Glory be to Allah as much as pleases Him, glory be to Him as heavy as the weight of His ‘Arsh (Throne), and glory be to Him as much as the ink (that would write) His words."}, "evidence": "HR. Muslim no. 2726. Syarah Muslim XVII/44. Dari Juwairiyah binti al-Harits radhiyallahu ‘anhuma.", "grade": "Shahih"}, {"id": "subhanallah-wa-bihamdihi", "title": {"id": "Subhanallahi wa Bihamdihi", "en": "Subhanallahi wa Bihamdihi"}, "count": 100, "arabic": "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ", "latin": "Subḥāna Allāhi wa-bi-ḥamdih.", "meaning": {"id": "Mahasuci Allah, aku memuji-Nya.", "en": "Glory be to Allah; I praise Him."}, "evidence": "HR. Muslim no. 2691 dan no. 2692, dari Abu Hurairah radhiyallahu ‘anhu. Syarah Muslim XVII/17-18, Shahiih at-Targhiib wat Tarhiib 1/413 no. 653.", "grade": "Shahih"}, {"id": "la-ilaha-illallah", "title": {"id": "La Ilaha Illallah", "en": "La Ilaha Illallah"}, "count": 100, "arabic": "لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ", "latin": "Lā ilāha illā Allāhu waḥdahū lā sharīka lah, lahu al-mulku wa-lahu al-ḥamd, wa-huwa ʿalā kulli shayʾin qadīr.", "meaning": {"id": "Tidak ada Tuhan selain Allah, Yang Mahaesa tidak ada sekutu bagi-Nya, milik-Nyalah segala kerajaan dan bagi-Nya pujian dan Dia Mahaberkuasa atas segala sesuatu.", "en": "There is no God but Allah, the One, with no partner. To Him belongs all dominion and to Him belongs all praise, and He has power over all things."}, "evidence": "“Barangsiapa membacanya sebanyak 100x dalam sehari, maka baginya (pahala) seperti memerdekakan sepuluh budak, ditulis seratus kebaikan, dihapus darinya seratus keburukan, mendapat perlindungan dari syaitan pada hari itu hingga sore hari. Tidaklah seseorang itu dapat mendatangkan yang lebih baik dari apa yang dibawanya kecuali ia melakukan lebih banyak lagi dari itu.” HR. Al-Bukhari no. 3293 dan 6403, Muslim IV/2071 no. 2691 (28), at-Tirmidzi no. 3468, Ibnu Majah no. 3798, dari Sahabat Abu Hurairah radhiyallahu ‘anhu. Penjelasan: Dalam riwayat an-Nasa-i (‘Amalul Yaum wal Lailah no. 580) dan Ibnus Sunni no. 75 dari ‘Amr bin Syu’aib dari ayahnya dari kakeknya dengan lafadz: “Barangsiapa membaca 100x pada pagi hari dan 100x pada sore hari.” Jadi, dzikir ini dibaca 100x diwaktu pagi dan 100x diwaktu sore. Lihat Silsilah al-Ahaadiits ash-Shahiihah no. 2762.", "countNote": "Dibaca 1× atau 10× atau 100×; menurut penjelasan, dibaca 100× di waktu pagi dan 100× di waktu sore.", "grade": "Shahih"}, {"id": "astaghfirullah", "title": {"id": "Istighfar", "en": "Seeking Forgiveness"}, "count": 100, "arabic": "أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ", "latin": "Astaghfiru Allāha wa-atūbu ilayh.", "meaning": {"id": "Aku memohon ampunan kepada Allah dan bertaubat kepada-Nya.", "en": "I ask Allah for forgiveness and I repent to Him."}, "evidence": "HR. Al-Bukhari/Fat-hul Baari XI/101 dan Muslim no. 2702. Dari Ibnu ‘Umar ia berkata: “Rasulullah ﷺ bersabda: ‘Wahai manusia, bertaubatlah kalian kepada Allah, sesungguhnya aku bertaubat kepada-Nya dalam sehari seratus kali.’” [HR. Muslim no. 2702 (42)]", "countNote": "Dibaca 100× dalam sehari. Catatan: Jumlah yang terbanyak dari dzikir-dzikir Nabi adalah seratus diwaktu pagi dan seratus diwaktu sore. Adapun riwayat yang menyebutkan sampai seribu, seratus ribu atau penyebutan suatu bilangan yang diada-adakan adalah munkar, karena haditsnya dha’if bahkan palsu. (Silsilah al-Ahaadiits adh-Dha-’iifah no. 5296).", "grade": "Shahih"}], "evening": [{"id": "ayat-kursi", "title": {"id": "Ayat Kursi", "en": "Ayat al-Kursi"}, "count": 1, "arabic": "اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ", "latin": "Allāhu lā ilāha illā huwa al-ḥayyu al-qayyūm. Lā taʾkhudhuhū sinatun wa-lā nawm. Lahū mā fī as-samāwāti wa-mā fī al-arḍ. Man dhā alladhī yashfaʿu ʿindahū illā bi-idhnih. Yaʿlamu mā bayna aydīhim wa-mā khalfahum. Wa-lā yuḥīṭūna bi-shayʾin min ʿilmihī illā bi-mā shāʾ. Wasiʿa kursiyyuhu as-samāwāti wa-l-arḍ. Wa-lā yaʾūduhū ḥifẓuhumā. Wa-huwa al-ʿaliyyu al-ʿaẓīm.", "meaning": {"id": "Allah tidak ada Ilah (yang berhak diibadahi dengan benar) melainkan Dia Yang Hidup Kekal lagi terus menerus mengurus (makhluk-Nya); tidak mengantuk dan tidak tidur. Kepunyaan-Nya apa yang ada di langit dan di bumi. Tidak ada yang dapat memberi syafa’at di sisi Allah tanpa izin-Nya. Allah mengetahui apa-apa yang (berada) dihadapan mereka, dan dibelakang mereka dan mereka tidak mengetahui apa-apa dari Ilmu Allah melainkan apa yang dikehendaki-Nya. Kursi Allah meliputi langit dan bumi. Dan Allah tidak merasa berat memelihara keduanya, Allah Mahatinggi lagi Mahabesar.", "en": "Allah — there is no Ilah (none worthy of being worshipped in truth) except Him, the Ever-Living, the One who continuously sustains and manages (His creation). Neither drowsiness nor sleep overtakes Him. To Him belongs whatever is in the heavens and on the earth. Who can intercede with Allah except by His permission? Allah knows what is before them and what is behind them, and they encompass nothing of Allah’s knowledge except what He wills. The Kursi of Allah extends over the heavens and the earth, and Allah is not burdened by preserving them both. Allah is the Most High, the Most Great."}, "evidence": "QS. Al-Baqarah/2: 255. Barangsiapa yang membaca ayat ini ketika pagi hari, maka ia dilindungi dari (gangguan) jin hingga sore hari. Dan barangsiapa mengucapkannya ketika sore hari, maka ia dilindungi dari (gangguan) jin hingga pagi hari. (Lihat Mustadrak Al-Hakim 1/562, Shahiih at-Targhiib wat Tarhiib 1/418 no. 662, shahih).", "grade": "Shahih"}, {"id": "al-ikhlas", "title": {"id": "Al-Ikhlas", "en": "Al-Ikhlas"}, "count": 3, "arabic": "قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ", "latin": "Qul huwa Allāhu aḥad. Allāhu aṣ-ṣamad. Lam yalid wa-lam yūlad. Wa-lam yakun lahū kufuwan aḥad.", "meaning": {"id": "Katakanlah, Dia-lah Allah Yang Maha Esa. Allah adalah (Rabb) yang segala sesuatu bergantung kepada-Nya. Dia tidak beranak dan tidak pula diperanakkan. Dan tidak ada seorang pun yang setara dengan-Nya.", "en": "Say: He is Allah, the One. Allah is the (Lord) upon Whom everything depends. He neither begets nor is begotten. And there is none at all comparable to Him."}, "evidence": "QS. Al-Ikhlash/112: 1-4. HR. Abu Dawud no. 5082, an-Nasa-i VIII/250 dan at-Tirmidzi no. 3575, Ahmad V/312, Shahiih at-Tirmidzi no. 2829, Tuhfatul Ahwadzi no. 3646, Shahiih at-Targhiib wat Tarhiib 1/411 no. 649, hasan shahih.", "grade": "Hasan shahih"}, {"id": "al-falaq", "title": {"id": "Al-Falaq", "en": "Al-Falaq"}, "count": 3, "arabic": "قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِنْ شَرِّ مَا خَلَقَ ۝ وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ", "latin": "Qul aʿūdhu bi-Rabbi al-falaq. Min sharri mā khalaq. Wa-min sharri ghāsiqin idhā waqab. Wa-min sharri an-naffāthāti fī al-ʿuqad. Wa-min sharri ḥāsidin idhā ḥasad.", "meaning": {"id": "Katakanlah: ‘Aku berlindung kepada Rabb Yang menguasai (waktu) Shubuh dari kejahatan makhluk-Nya. Dan dari kejahatan malam apabila telah gelap gulita. Dan dari kejahatan wanita-wanita tukang sihir yang menghembus pada buhul-buhul. Serta dari kejahatan orang yang dengki apabila dia dengki.’", "en": "Say: ‘I seek refuge with the Lord who has dominion over (the time of) daybreak, from the evil of His creation. And from the evil of the night when it has grown pitch dark. And from the evil of the women who practise sorcery, blowing on knots. And from the evil of the envier when he envies.’"}, "evidence": "QS. Al-Falaq/113: 1-5. HR. Abu Dawud no. 5082, an-Nasa-i VIII/250 dan at-Tirmidzi no. 3575, Ahmad V/312, Shahiih at-Tirmidzi no. 2829, Tuhfatul Ahwadzi no. 3646, Shahiih at-Targhiib wat Tarhiib 1/411 no. 649, hasan shahih.", "grade": "Hasan shahih"}, {"id": "an-naas", "title": {"id": "An-Naas", "en": "An-Naas"}, "count": 3, "arabic": "قُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝ مَلِكِ النَّاسِ ۝ إِلَٰهِ النَّاسِ ۝ مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝ مِنَ الْجِنَّةِ وَالنَّاسِ", "latin": "Qul aʿūdhu bi-Rabbi an-nās. Maliki an-nās. Ilāhi an-nās. Min sharri al-waswāsi al-khannās. Alladhī yuwaswisu fī ṣudūri an-nās. Mina al-jinnati wa-n-nās.", "meaning": {"id": "Katakanlah, ‘Aku berlindung kepada Rabb (yang memelihara dan menguasai) manusia. Raja manusia. Sembahan (Ilah) manusia. Dari kejahatan (bisikan) syaitan yang biasa bersembunyi. Yang membisikkan (kejahatan) ke dalam dada-dada manusia. Dari golongan jin dan manusia.’", "en": "Say, ‘I seek refuge with the Lord (who nurtures and has dominion over) mankind. The King of mankind. The Ilah (God) of mankind. From the evil of the (whispering of the) devil who habitually hides away. Who whispers (evil) into the hearts of mankind. From among the jinn and mankind.’"}, "evidence": "QS. An-Naas/114: 1-6. HR. Abu Dawud no. 5082, an-Nasa-i VIII/250 dan at-Tirmidzi no. 3575, Ahmad V/312, Shahiih at-Tirmidzi no. 2829, Tuhfatul Ahwadzi no. 3646, Shahiih at-Targhiib wat Tarhiib 1/411 no. 649, hasan shahih.", "grade": "Hasan shahih"}, {"id": "fitrah", "title": {"id": "Dzikir Fitrah Islam", "en": "Dhikr of the Islamic Fitrah"}, "count": 1, "arabic": "أَمْسَيْنَا عَلَى فِطْرَةِ الْإِسْلَامِ، وَعَلَى كَلِمَةِ الْإِخْلَاصِ، وَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ ﷺ، وَعَلَى مِلَّةِ أَبِينَا إِبْرَاهِيمَ حَنِيفًا مُسْلِمًا وَمَا كَانَ مِنَ الْمُشْرِكِينَ", "latin": "Amsaynā ʿalā fiṭrati al-islām, wa-ʿalā kalimati al-ikhlāṣ, wa-ʿalā dīni nabiyyinā Muḥammad ṣallā Allāhu ʿalayhi wa-sallam, wa-ʿalā millati abīnā Ibrāhīma ḥanīfan musliman wa-mā kāna mina al-mushrikīn.", "meaning": {"id": "Di waktu petang kami berada di atas fitrah agama Islam, kalimat ikhlas, agama Nabi kami Muhammad ﷺ dan agama ayah kami, Ibrahim, yang berdiri di atas jalan yang lurus, muslim dan tidak tergolong orang-orang musyrik.", "en": "In the evening we are upon the fitrah of the religion of Islam, the word of sincerity, the religion of our Prophet Muhammad ﷺ, and the religion of our father Ibrahim, who stood upon the straight path, a Muslim, and was not among the polytheists."}, "evidence": "HR. Ahmad III/406, 407, ad-Darimi II/292 dan Ibnus Sunni dalam Amalul Yaum wol Lailah no. 34, Misykaatul Mashaabiih no. 2415, Shahiihal-Jaami’ish Shaghiir no. 4674, shahih.", "grade": "Shahih"}, {"id": "raditu", "title": {"id": "Ridha kepada Allah", "en": "Contentment with Allah"}, "count": 3, "arabic": "رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ نَبِيًّا", "latin": "Raḍītu bi-llāhi Rabbā, wa-bi-l-islāmi dīnā, wa-bi-Muḥammadin nabiyyā.", "meaning": {"id": "Aku rela (ridha) Allah sebagai Rabb-ku (untukku dan orang lain), Islam sebagai agamaku dan Muhammad ﷺ sebagai Nabiku (yang diutus oleh Allah).", "en": "I am pleased (content) with Allah as my Lord (for myself and for others), with Islam as my religion, and with Muhammad ﷺ as my Prophet (the one sent by Allah)."}, "evidence": "“Barangsiapa membacanya sebanyak tiga kali ketika pagi dan sore, maka Allah memberikan keridhaan-Nya kepadanya pada hari Kiamat.” HR. Ahmad IV/337, Abu Dawud no. 5072, at-Tirmidzi no. 3389, Ibnu Majah no. 3870, an-Nasa-i dalam ‘Amalul Yaum wal Lailah no. 4 dan Ibnus Sunni no. 68, dishahihkan oleh Imam al-Hakim dalam al-Mustadrak 1/518 dan disetujui oleh Imam adz-Dzahabi, hasan. Lihat Shahiih At Targhiib wat Tarhiib I/415 no. 657, Shahiih At Targhiib wat Tarhiib al-Waabilish Shayyib hal. 170, Zaadul Ma’aad II/372, Silsilah al-Ahaadiits ash-Shahiihah no. 2686.", "grade": "Hasan"}, {"id": "bika-amsayna", "title": {"id": "Dengan-Mu Kami Memasuki Petang", "en": "By You We Enter the Evening"}, "count": 1, "arabic": "اللَّهُمَّ بِكَ أَمْسَيْنَا، وَبِكَ أَصْبَحْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ الْمَصِيرُ", "latin": "Allāhumma bika amsaynā, wa-bika aṣbaḥnā, wa-bika naḥyā, wa-bika namūt, wa-ilayka al-maṣīr.", "meaning": {"id": "Ya Allah, dengan rahmat dan pertolongan-Mu kami memasuki waktu petang, dan dengan rahmat dan pertolongan-Mu kami memasuki waktu pagi. Dengan rahmat dan kehendak-Mu kami hidup dan dengan rahmat dan kehendak-Mu kami mati. Dan kepada-Mu tempat kembali (bagi semua makhluk).", "en": "O Allah, by Your mercy and help we enter the evening, and by Your mercy and help we enter the morning. By Your mercy and will we live, and by Your mercy and will we die. And to You is the final return (of all creatures)."}, "evidence": "HR. Al-Bukhari dalam al-Adabul Mufrad no. 1199, lafazh ini adalah lafazh al-Bukhari, at-Tirmidzi no. 3391, Abu Dawud no. 5068, Ahmad 11/354, Ibnu Majah no. 3868, Dari Abu Hurairah Radhiyallahu ‘anhu. Shahiih al-Adabil Mufrad no. 911, shahih. Lihat pula Silsilah al-Ahaadiits ash-Shahiihah no. 262.", "grade": "Shahih"}, {"id": "amsayna-mulk", "title": {"id": "Kami Memasuki Petang dan Kerajaan Milik Allah", "en": "We Enter the Evening and Sovereignty Belongs to Allah"}, "count": 1, "arabic": "أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ. رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذِهِ اللَّيْلَةِ وَخَيْرَ مَا بَعْدَهَا، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذِهِ اللَّيْلَةِ وَشَرِّ مَا بَعْدَهَا. رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ. رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ", "latin": "Amsaynā wa-amsā al-mulku li-llāh, wa-l-ḥamdu li-llāh, lā ilāha illā Allāhu waḥdahū lā sharīka lah, lahu al-mulku wa-lahu al-ḥamd, wa-huwa ʿalā kulli shayʾin qadīr. Rabbi asʾaluka khayra mā fī hādhihi al-laylati wa-khayra mā baʿdahā, wa-aʿūdhu bika min sharri mā fī hādhihi al-laylati wa-sharri mā baʿdahā. Rabbi aʿūdhu bika mina al-kasali wa-sūʾi al-kibar. Rabbi aʿūdhu bika min ʿadhābin fī an-nār wa-ʿadhābin fī al-qabr.", "meaning": {"id": "Kami telah memasuki waktu petang dan kerajaan hanya milik Allah, segala puji bagi Allah. Tidak ada ilah (yang berhak disembah) kecuali Allah semata, tiada sekutu bagi-Nya. Milik Allah kerajaan dan bagi-Nya pujian. Dia-lah Yang Mahakuasa atas segala sesuatu. Wahai Rabbku, aku mohon kepada-Mu kebaikan di malam ini dan kebaikan sesudahnya. Aku berlindung kepada-Mu dari kejahatan malam ini dan kejahatan sesudahnya. Wahai Rabbku, aku berlindung kepada-Mu dari kemalasan dan kejelekan di hari tua. Wahai Rabbku, aku berlindung kepada-Mu dari siksaan di neraka dan siksaan di kubur.", "en": "We have entered the evening and the dominion belongs to Allah alone; all praise is for Allah. There is no ilah (none worthy of worship) except Allah alone, with no partner. To Allah belongs the dominion and to Him belongs the praise. He is the One who has power over all things. O my Lord, I ask You for the good of this night and the good of what comes after it. I seek refuge with You from the evil of this night and the evil of what comes after it. O my Lord, I seek refuge with You from laziness and the misery of old age. O my Lord, I seek refuge with You from punishment in the Fire and punishment in the grave."}, "evidence": "HR. Muslim no. 2723 (75), Abu Dawud no. 5071, dan at-Tirmidzi 3390, shahih dari Abdullah Ibnu Mas’ud.", "grade": "Shahih"}, {"id": "sayyidul-istighfar", "title": {"id": "Sayyidul Istighfar", "en": "Master Supplication for Forgiveness"}, "count": 1, "arabic": "اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي، فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ", "latin": "Allāhumma anta Rabbī lā ilāha illā anta, khalaqtanī wa-anā ʿabduka, wa-anā ʿalā ʿahdika wa-waʿdika mā istaṭaʿtu, aʿūdhu bika min sharri mā ṣanaʿtu, abūʾu laka bi-niʿmatika ʿalayya, wa-abūʾu bi-dhanbī, fa-ghfir lī, fa-innahū lā yaghfiru adh-dhunūba illā anta.", "meaning": {"id": "Ya Allah, Engkau lah Tuhanku. Tidak ada Tuhan selain Engkau. Engkau yang menciptakan aku dan aku adalah hamba-Mu. Aku berada di dalam hidayah-Mu, dan perjanjian dengan-Mu. Sebisa yang aku mampu. Aku berlindung kepada-Mu, dari segala kejelekan yang aku perbuat. Aku bersyukur atas nikmat yang Engkau limpahkan kepada kami, dan aku menyesal atas segala dosa yang aku perbuat. Maka ampunilah aku, sesungguhnya tidak ada yang dapat mengampuni dosa selain Engkau.", "en": "O Allah, You are my Lord. There is no God but You. You created me and I am Your servant. I am within Your guidance and the covenant with You, as far as I am able. I seek refuge with You from all the evil that I have done. I am grateful for the blessings You have bestowed upon us, and I regret all the sins I have committed. So forgive me, for truly none can forgive sins except You."}, "evidence": "“Barangsiapa membacanya dengan yakin di waktu pagi lalu ia meninggal sebelum masuk waktu sore, maka ia termasuk ahli Surga. Dan barangsiapa membacanya dengan yakin di waktu sore lalu ia meninggal sebelum masuk waktu pagi, maka ia termasuk ahli Surga.” (HR. Al-Bukhari no. 6306, 6323, Ahmad IV/122-125, an-Nasa-i VIII/279-280) dari Syaddad bin Aus Radhiyallahu ‘anhu", "grade": "Shahih"}, {"id": "afwu-afiyah", "title": {"id": "Memohon ‘Afw dan ‘Afiyah", "en": "Asking for Pardon and Well-being"}, "count": 1, "arabic": "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي، اللَّهُمَّ اسْتُرْ عَوْرَاتِي وَآمِنْ رَوْعَاتِي، اللَّهُمَّ احْفَظْنِي مِنْ بَيْنِ يَدَيَّ وَمِنْ خَلْفِي وَعَنْ يَمِينِي وَعَنْ شِمَالِي وَمِنْ فَوْقِي، وَأَعُوذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي", "latin": "Allāhumma innī asʾaluka al-ʿafwa wa-l-ʿāfiyata fī ad-dunyā wa-l-ākhirah, Allāhumma innī asʾaluka al-ʿafwa wa-l-ʿāfiyata fī dīnī wa-dunyāya wa-ahlī wa-mālī, Allāhumma ustur ʿawrātī wa-āmin rawʿātī, Allāhumma iḥfaẓnī min bayni yadayya wa-min khalfī wa-ʿan yamīnī wa-ʿan shimālī wa-min fawqī, wa-aʿūdhu bi-ʿaẓamatika an ughtāla min taḥtī.", "meaning": {"id": "Ya Allah, sesungguhnya aku memohon kebajikan dan keselamatan di dunia dan akhirat. Ya Allah, sesungguhnya aku memohon kebajikan dan keselamatan dalam agama, dunia, keluarga dan hartaku. Ya Allah, tutupilah auratku (aib dan sesuatu yang tidak layak dilihat orang) dan tentramkan-lah aku dari rasa takut. Ya Allah, peliharalah aku dari depan, belakang, kanan, kiri dan dari atasku. Aku berlindung dengan kebesaran-Mu, agar aku tidak disambar dari bawahku (aku berlindung dari dibenamkan ke dalam bumi).", "en": "O Allah, I truly ask You for goodness and well-being in this world and the Hereafter. O Allah, I truly ask You for goodness and well-being in my religion, my worldly life, my family and my wealth. O Allah, cover my ‘awrah (my faults and whatever is not fit to be seen by others) and calm me from fear. O Allah, protect me from in front of me, from behind, from my right, my left, and from above me. I seek refuge in Your greatness, that I not be seized from beneath me (I seek refuge from being swallowed into the earth)."}, "evidence": "HR. Al-Bukhari dalam al-Adabul Mufrad no. 1200, Abu Dawud no. 5074, An-Nasa-i VIII/282, Ibnu Majah no. 3871, al-Hakim 1/517-518, dan lainnya dari Ibnu Umar radhiyallahu ‘anhumaa. Lihat Shahiih al-Adabul Mufrad no. 912, shahih.", "grade": "Shahih"}, {"id": "afini-badani", "title": {"id": "Memohon Kesehatan Badan", "en": "Asking for Well-being"}, "count": 3, "arabic": "اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَهَ إِلَّا أَنْتَ، اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكُفْرِ وَالْفَقْرِ، اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ، لَا إِلَهَ إِلَّا أَنْتَ", "latin": "Allāhumma ʿāfinī fī badanī, Allāhumma ʿāfinī fī samʿī, Allāhumma ʿāfinī fī baṣarī, lā ilāha illā anta, Allāhumma innī aʿūdhu bika mina al-kufri wa-l-faqr, Allāhumma innī aʿūdhu bika min ʿadhābi al-qabr, lā ilāha illā anta.", "meaning": {"id": "Ya Allah, selamatkanlah tubuhku (dari penyakit dan dari apa yang tidak aku inginkan). Ya Allah, selamatkanlah pendengaranku. Ya Allah, selamatkanlah penglihatanku, tidak ada Ilah yang berhak diibadahi dengan benar kecuali Engkau. Ya Allah sesungguhnya aku berlindung kepada-Mu dari kekufuran dan kefakiran. Aku berlindung kepada-Mu dari siksa kubur, tidak ada Ilah yang berhak diibadahi dengan benar kecuali Engkau.", "en": "O Allah, keep my body safe (from illness and from what I do not want). O Allah, keep safe my hearing. O Allah, keep safe my sight; there is no Ilah worthy of worship in truth except You. O Allah, truly I seek refuge with You from disbelief and poverty. I seek refuge with You from the punishment of the grave; there is no Ilah worthy of worship in truth except You."}, "evidence": "HR. Al-Bukhari dalam Shahiih al-Adabil Mufrad no. 701, Abu Dawud no. 5090, Ahmad V/42, hasan. Lihat Shahiih Al-Adabil Mufrad no. 539.", "grade": "Hasan"}, {"id": "alim-ghaib", "title": {"id": "Allah Yang Mengetahui yang Ghaib", "en": "Allah, Knower of the Unseen"}, "count": 1, "arabic": "اللَّهُمَّ عَالِمَ الْغَيْبِ وَالشَّهَادَةِ، فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ، رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ، أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي، وَمِنْ شَرِّ الشَّيْطَانِ وَشِرْكِهِ، وَأَنْ أَقْتَرِفَ عَلَى نَفْسِي سُوءًا أَوْ أَجُرَّهُ إِلَى مُسْلِمٍ", "latin": "Allāhumma ʿālima al-ghaybi wa-sh-shahādah, fāṭira as-samāwāti wa-l-arḍ, Rabba kulli shayʾin wa-malīkah, ashhadu an lā ilāha illā anta, aʿūdhu bika min sharri nafsī, wa-min sharri ash-shayṭāni wa-shirkih, wa-an aqtarifa ʿalā nafsī sūʾan aw ajurrahū ilā muslim.", "meaning": {"id": "Ya Allah Yang Mahamengetahui yang ghaib dan yang nyata, wahai Rabb Pencipta langit dan bumi, Rabb atas segala sesuatu dan Yang Merajainya. Aku bersaksi bahwa tidak ada Ilah yang berhak diibadahi dengan benar kecuali Engkau. Aku berlindung kepada-Mu dari kejahatan diriku, syaitan dan ajakannya menyekutukan Allah (aku berlindung kepada-Mu) dari berbuat kejelekan atas diriku atau mendorong seorang muslim kepadanya.", "en": "O Allah, the All-Knowing of the unseen and the seen, O Lord, Creator of the heavens and the earth, Lord of all things and their Sovereign. I bear witness that there is no Ilah worthy of worship in truth except You. I seek refuge with You from the evil of myself, and from the devil and his call to associate partners with Allah (I seek refuge with You) from doing wrong against myself or drawing a Muslim into it."}, "evidence": "HR. Al-Bukhari dalam Al-Adabul Mufrad 1202, at-Tirmidzi no. 3392 dan Abu Daud no. 5067. Lihat Shahih At-Tirmidzi no. 2798.", "grade": "Shahih"}, {"id": "bismillah-la-yadurru", "title": {"id": "Bismillah yang Tidak Membahayakan", "en": "Bismillah for Protection"}, "count": 3, "arabic": "بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ", "latin": "Bi-smi llāhi alladhī lā yaḍurru maʿa ismihī shayʾun fī al-arḍi wa-lā fī as-samāʾ, wa-huwa as-samīʿu al-ʿalīm.", "meaning": {"id": "Dengan Menyebut Nama Allah, yang dengan Nama-Nya tidak ada satupun yang membahayakan, baik di bumi maupun di langit. Dia-lah Yang Mahamendengar dan Mahamengetahui.", "en": "In the name of Allah, with whose Name nothing at all can cause harm, whether on earth or in heaven. He is the All-Hearing and the All-Knowing."}, "evidence": "“Barangsiapa membacanya sebanyak tiga kali ketika pagi dan sore hari, maka tidak ada sesuatu pun yang membahayakan dirinya.” HR. At-Tirmidzi no. 3388, Abu Dawud no. 5088, Ibnu Majah no. 3869, al-Hakim 1/514, dan Ahmad no. 446 dan 474, Tahqiq Ahmad Syakir. Dari ‘Utsman bin ‘Affan radhiyallahu ‘anhu, lihat Shahiih Ibni Majah no. 3120, al-Hakim 1/513, Shahiih al-Adabil Mufrad no. 513, Shahiih at-Targhiib wat Tarhiib 1/413 no. 655, sanad-nya shahih.", "grade": "Shahih"}, {"id": "hayyu-qayyum", "title": {"id": "Ya Hayyu Ya Qayyum", "en": "O Ever-Living, O Sustainer"}, "count": 1, "arabic": "يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ، أَصْلِحْ لِي شَأْنِي كُلَّهُ، وَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ", "latin": "Yā Ḥayyu yā Qayyūm, bi-raḥmatika astaghīth, aṣliḥ lī shaʾnī kullah, wa-lā takilnī ilā nafsī ṭarfata ʿayn.", "meaning": {"id": "Wahai Rabb Yang Maha Hidup, wahai Rabb Yang Berdiri Sendiri (tidak butuh segala sesuatu), dengan rahmat-Mu aku minta pertolongan, perbaikilah segala urusanku dan jangan diserahkan kepadaku sekalipun sekejap mata (tanpa mendapat pertolongan dari-Mu).", "en": "O Lord, the Ever-Living, O Lord, the Self-Subsisting (in need of nothing), by Your mercy I ask for help. Set right all my affairs, and do not leave me to myself even for the blink of an eye (without receiving help from You)."}, "evidence": "HR. An-Nasa-i dalam ‘Amalul Yaum wal Lailah no. 575, dan al-Hakim 1/545, lihat Shahiih at-Targhiib wat Tarhiib 1/417 no. 661, Ash-shahiihah no. 227, hasan, dari Anas radhiyallahu ‘anhu.", "grade": "Hasan"}, {"id": "audu-kalimatillah", "title": {"id": "Berlindung dengan Kalimat Allah", "en": "Seeking Refuge in the Perfect Words of Allah"}, "count": 3, "arabic": "أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ", "latin": "Aʿūdhu bi-kalimāti Allāhi at-tāmmāti min sharri mā khalaq.", "meaning": {"id": "Aku berlindung dengan kalimat-kalimat Allah yang sempurna, dari kejahatan sesuatu yang diciptakan-Nya.", "en": "I seek refuge in the perfect words of Allah, from the evil of what He has created."}, "evidence": "HR. Muslim no. 2708.", "grade": "Shahih"}, {"id": "subhanallah-wa-bihamdihi", "title": {"id": "Subhanallahi wa Bihamdihi", "en": "Subhanallahi wa Bihamdihi"}, "count": 100, "arabic": "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ", "latin": "Subḥāna Allāhi wa-bi-ḥamdih.", "meaning": {"id": "Mahasuci Allah, aku memuji-Nya.", "en": "Glory be to Allah; I praise Him."}, "evidence": "HR. Muslim no. 2691 dan no. 2692, dari Abu Hurairah radhiyallahu ‘anhu. Syarah Muslim XVII/17-18, Shahiih at-Targhiib wat Tarhiib 1/413 no. 653.", "grade": "Shahih"}, {"id": "la-ilaha-illallah", "title": {"id": "La Ilaha Illallah", "en": "La Ilaha Illallah"}, "count": 100, "arabic": "لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ", "latin": "Lā ilāha illā Allāhu waḥdahū lā sharīka lah, lahu al-mulku wa-lahu al-ḥamd, wa-huwa ʿalā kulli shayʾin qadīr.", "meaning": {"id": "Tidak ada Tuhan selain Allah, Yang Mahaesa tidak ada sekutu bagi-Nya, milik-Nyalah segala kerajaan dan bagi-Nya pujian dan Dia Mahaberkuasa atas segala sesuatu.", "en": "There is no God but Allah, the One, with no partner. To Him belongs all dominion and to Him belongs all praise, and He has power over all things."}, "evidence": "“Barangsiapa membacanya sebanyak 100x dalam sehari, maka baginya (pahala) seperti memerdekakan sepuluh budak, ditulis seratus kebaikan, dihapus darinya seratus keburukan, mendapat perlindungan dari syaitan pada hari itu hingga sore hari. Tidaklah seseorang itu dapat mendatangkan yang lebih baik dari apa yang dibawanya kecuali ia melakukan lebih banyak lagi dari itu.” HR. Al-Bukhari no. 3293 dan 6403, Muslim IV/2071 no. 2691 (28), at-Tirmidzi no. 3468, Ibnu Majah no. 3798, dari Sahabat Abu Hurairah radhiyallahu ‘anhu. Penjelasan: Dalam riwayat an-Nasa-i (‘Amalul Yaum wal Lailah no. 580) dan Ibnus Sunni no. 75 dari ‘Amr bin Syu’aib dari ayahnya dari kakeknya dengan lafadz: “Barangsiapa membaca 100x pada pagi hari dan 100x pada sore hari.” Jadi, dzikir ini dibaca 100x diwaktu pagi dan 100x diwaktu sore. Lihat Silsilah al-Ahaadiits ash-Shahiihah no. 2762.", "countNote": "Dibaca 1× atau 10× atau 100×; menurut penjelasan, dibaca 100× di waktu pagi dan 100× di waktu sore. Catatan: Jumlah yang terbanyak dari dzikir-dzikir Nabi adalah seratus diwaktu pagi dan seratus diwaktu sore. Adapun riwayat yang menyebutkan sampai seribu, seratus ribu atau penyebutan suatu bilangan yang diada-adakan adalah munkar, karena haditsnya dha’if bahkan palsu. (Silsilah al-Ahaadiits adh-Dha-’iifah no. 5296).", "grade": "Shahih"}]};

const I18N = {
  id:{eyebrow:"Daily Companion",title:"Dzikir Pagi & Petang",subtitle:"Sesuai Sunnah Nabi ﷺ",morning:"Pagi",evening:"Petang",finished:"selesai",meaning:"Arti",evidence:"Dalil",grade:"Derajat",latin:"Latin",tap:"TAP",reset:"Reset",confirm:"Yakin? Ketuk lagi",done:"Selesai",dark:"Gelap",light:"Terang",doneMorning:"Dzikir pagi hari ini selesai.",doneEvening:"Dzikir petang hari ini selesai.",footer:"Sumber utama: Dzikir Pagi & Petang Sesuai Sunnah Nabi ﷺ — Yayasan Cinta Sedekah."},
  en:{eyebrow:"Daily Companion",title:"Morning & Evening Dhikr",subtitle:"According to the Sunnah of the Prophet ﷺ",morning:"Morning",evening:"Evening",finished:"completed",meaning:"Meaning",evidence:"Evidence",grade:"Grade",latin:"Latin",tap:"TAP",reset:"Reset",confirm:"Sure? Tap again",done:"Done",dark:"Dark",light:"Light",doneMorning:"Today's morning dhikr is complete.",doneEvening:"Today's evening dhikr is complete.",footer:"Primary source: Dzikir Pagi & Petang Sesuai Sunnah Nabi ﷺ — Yayasan Cinta Sedekah."}
};

/* ---------- storage (safe when localStorage is blocked or corrupt) ---------- */
const store={
  get(k,f){try{const v=localStorage.getItem(k);return v===null?f:v}catch(e){return f}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
};
const $=id=>document.getElementById(id);
const mq=q=>{try{return matchMedia(q).matches}catch(e){return false}};
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
/* progress is per calendar day: {date, counts:{"session:id":n}}; the old flat format is adopted as today's */
function loadProgress(){
  let p;
  try{p=JSON.parse(store.get("dhikr-progress","{}"))}catch(e){p=null}
  if(!p||typeof p!=="object"||Array.isArray(p)) p={};
  if(p.counts&&typeof p.counts==="object") return p.date===today()?p:{date:today(),counts:{}};
  return {date:today(),counts:p};
}

let lang=store.get("dhikr-lang","id"); if(!I18N[lang]) lang="id";
let theme=store.get("dhikr-theme",mq("(prefers-color-scheme: dark)")?"dark":"light"); if(theme!=="dark") theme="light";
let session=store.get("dhikr-session","morning"); if(!DATA[session]) session="morning";
let latin=store.get("dhikr-latin","0")==="1"; // romanized Arabic, off by default
let progress=loadProgress();
const open=new Set();
let nodes=[],lockUntil=0;
const reduceMotion=mq("(prefers-reduced-motion: reduce)");

const t=k=>I18N[lang][k]||k;
const key=id=>session+":"+id;
const getCount=d=>Math.min(Math.max(parseInt(progress.counts[key(d.id)],10)||0,0),d.count);
const save=()=>store.set("dhikr-progress",JSON.stringify(progress));
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
const escapeHtml=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

/* ---------- rendering ---------- */
function build(d,i){
  const el=document.createElement("article");
  el.className="item";
  el.innerHTML=`
    <h2 class="h"><button class="head" aria-expanded="false" aria-controls="b-${i}">
      <span class="num">${String(i+1).padStart(2,"0")}</span><span class="title">${escapeHtml(d.title[lang])}</span><span class="count"></span>
    </button></h2>
    <div class="body" id="b-${i}" hidden>
      <p class="arabic" lang="ar" dir="rtl">${escapeHtml(d.arabic)}</p>
      ${latin&&d.latin?`<p class="latin" lang="ar-Latn">${escapeHtml(d.latin)}</p>`:""}
      <p class="label">${t("meaning")}</p>
      <p class="meaning">${escapeHtml(d.meaning[lang])}</p>
      <p class="label">${t("evidence")}</p>
      <p class="evidence">${escapeHtml(d.evidence)}</p>
      <p class="grade">${t("grade")}: ${escapeHtml(d.grade)}</p>
      ${d.countNote?`<p class="note">${escapeHtml(d.countNote)}</p>`:""}
      <div class="counter">
        <div class="readout" aria-live="polite"><span class="cur"></span><small> / ${d.count}</small></div>
        <button class="tap"></button>
      </div>
      <button class="reset">${t("reset")}</button>
    </div>`;
  const reset=el.querySelector(".reset");let timer=0;
  const disarm=()=>{clearTimeout(timer);reset.textContent=t("reset");delete reset.dataset.arm};
  el.querySelector(".head").addEventListener("click",()=>setOpen(i,!open.has(key(d.id))));
  el.querySelector(".tap").addEventListener("click",()=>tap(d,i));
  reset.addEventListener("click",()=>{
    if(reset.dataset.arm){disarm();delete progress.counts[key(d.id)];save();refresh(d,i);updateProgress()}
    else{reset.dataset.arm="1";reset.textContent=t("confirm");timer=setTimeout(disarm,3000)}
  });
  return el;
}
function refresh(d,i){
  const el=nodes[i],c=getCount(d),done=c>=d.count;
  el.classList.toggle("done",done);
  el.querySelector(".cur").textContent=c;
  el.querySelector(".count").textContent=done?t("done"):(c>0?c+" / "+d.count:d.count+"×");
  const tp=el.querySelector(".tap");tp.disabled=done;tp.textContent=done?t("done"):t("tap");
  el.querySelector(".reset").hidden=c===0;
}
function setOpen(i,state){
  const d=DATA[session][i],el=nodes[i],k=key(d.id);
  state?open.add(k):open.delete(k);
  el.querySelector(".head").setAttribute("aria-expanded",String(state));
  el.querySelector(".body").hidden=!state;
}
function render(){
  const items=DATA[session],frag=document.createDocumentFragment();
  if(!items.some(d=>open.has(key(d.id)))){ // start on the first unfinished dhikr
    const f=items.findIndex(d=>getCount(d)<d.count); if(f>-1) open.add(key(items[f].id));
  }
  nodes=items.map((d,i)=>{const el=build(d,i);frag.appendChild(el);return el});
  $("list").replaceChildren(frag);
  items.forEach((d,i)=>{refresh(d,i);setOpen(i,open.has(key(d.id)))});
  updateProgress();
}
function updateProgress(){
  const items=DATA[session],n=items.filter(d=>getCount(d)>=d.count).length;
  const pct=items.length?Math.round(n/items.length*100):0;
  $("progressText").textContent=`${n} / ${items.length} ${t("finished")}`;
  $("progressBar").style.width=pct+"%";
  $("bar").setAttribute("aria-valuenow",pct);
  $("bar").setAttribute("aria-label",`${t(session)}: ${pct}%`);
  const all=n===items.length;
  $("complete").hidden=!all;
  if(all) $("complete").textContent=t(session==="morning"?"doneMorning":"doneEvening");
}

/* ---------- interaction ---------- */
function tap(d,i){
  if(performance.now()<lockUntil) return;
  const c=getCount(d); if(c>=d.count) return;
  progress.counts[key(d.id)]=c+1;save();
  refresh(d,i);updateProgress();
  if(c+1<d.count){buzz(8);return}
  buzz(24);advance(i);
}
function advance(i){ // finished one: fold it and open the next unfinished one
  const items=DATA[session];
  setOpen(i,false);
  const n=items.findIndex((d,k)=>k>i&&getCount(d)<d.count);
  if(n<0) return;
  setOpen(n,true);
  lockUntil=performance.now()+400; // guard against a stray double-tap landing on the next counter
  nodes[n].scrollIntoView({block:"start",behavior:reduceMotion?"auto":"smooth"});
}
function applyTheme(){
  document.documentElement.dataset.theme=theme;
  document.querySelector('meta[name="theme-color"]').content=theme==="dark"?"#151816":"#f7f5ef";
  $("themeBtn").textContent=t(theme==="dark"?"light":"dark");
}
function applyLang(){
  document.documentElement.lang=lang;document.title=t("title");
  document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));
  $("idBtn").setAttribute("aria-pressed",String(lang==="id"));
  $("enBtn").setAttribute("aria-pressed",String(lang==="en"));
  $("latinBtn").setAttribute("aria-pressed",String(latin));
  applyTheme();render();
}
function setLang(l){lang=l;store.set("dhikr-lang",l);applyLang()}
function setSession(s){
  session=s;store.set("dhikr-session",s);
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.session===s)));
  render();
  const y=$("list").getBoundingClientRect().top+scrollY-$("sticky").offsetHeight;
  if(scrollY>y) scrollTo(0,Math.max(0,y));
}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>setSession(b.dataset.session)));
$("idBtn").onclick=()=>setLang("id");
$("enBtn").onclick=()=>setLang("en");
$("latinBtn").onclick=()=>{latin=!latin;store.set("dhikr-latin",latin?"1":"0");$("latinBtn").setAttribute("aria-pressed",String(latin));render()};
$("themeBtn").onclick=()=>{theme=theme==="dark"?"light":"dark";store.set("dhikr-theme",theme);applyTheme()};
document.addEventListener("visibilitychange",()=>{ // new day while the app stayed open
  if(!document.hidden&&progress.date!==today()){progress={date:today(),counts:{}};save();render()}
});
document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.session===session)));
applyLang();
</script>
</body>
</html>
